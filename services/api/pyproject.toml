[project]
name = "aisa"
version = "0.1.0"
description = "AISA API: intake, scoring, digest, WhatsApp gateway and dashboard API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "google-adk>=2.12.0",
  "google-cloud-aiplatform[agent-engines]>=2.6.0",
  "google-cloud-firestore>=2.34.1",
  "google-cloud-storage>=3.17.1",
  "google-genai>=2.32.0",
  "httpx>=0.28.1",
  "pypdf>=6.21.1",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisa"]

[project.scripts]
aisa = "aisa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
